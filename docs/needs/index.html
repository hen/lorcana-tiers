<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' https://api.lorcana.ravensburger.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Lorcana Needs</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Lorcana Collection</p>
      </header>

      <section class="filters" aria-label="Card filters">
        <label class="search-label" for="search">Search cards</label>
        <input id="search" type="search" placeholder="Search by card name" autocomplete="off" list="card-names">
        <datalist id="card-names"></datalist>
        <label class="rarity-toggle" for="rare-toggle">
          <input id="rare-toggle" type="checkbox">
          <span>Rare?</span>
        </label>
        <label class="set-filter" for="set-filter">
          <span>Set</span>
          <select id="set-filter">
            <option value="">All Sets</option>
            <option value="001">Set 1</option>
            <option value="002">Set 2</option>
            <option value="003">Set 3</option>
            <option value="004">Set 4</option>
            <option value="005">Set 5</option>
            <option value="006">Set 6</option>
            <option value="007">Set 7</option>
            <option value="008">Set 8</option>
            <option value="009">Set 9</option>
            <option value="010">Set 10</option>
            <option value="011">Set 11</option>
            <option value="012">Set 12</option>
            <option value="013">Set 13</option>
          </select>
        </label>
      </section>

      <p id="results-summary" class="results-summary" aria-live="polite">Loading cards…</p>
      <section id="cards" class="card-grid" aria-label="Cards needed"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
