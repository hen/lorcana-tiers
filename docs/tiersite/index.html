<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lorcana Set 12 Tier List</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Lorcana Set 12</p>
          <h1>Lorcana Tier Views</h1>
          <p class="subhead">
            Drag cards from the untiered pool into A, B, C+, C, C-, D+, D, or F. Cost tabs and filter tabs
            share the same underlying placements, and costs 7 and up are grouped together.
          </p>
        </div>
        <div class="hero-actions">
          <div class="action-row">
            <button id="export-json" class="secondary-button" type="button">Export JSON</button>
            <button id="import-json" class="secondary-button" type="button">Import JSON</button>
            <button id="reset-all" class="secondary-button" type="button">Reset all tiers</button>
          </div>
          <p id="status-message" class="status-message" aria-live="polite"></p>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
      </header>

      <section class="tabs-shell">
        <nav id="tabs" class="tabs" aria-label="Card tier views"></nav>
        <div class="tab-filters" aria-label="Rarity filters">
          <label class="filter-toggle" for="cu-only-toggle">
            <input id="cu-only-toggle" type="checkbox">
            <span>C/U Only</span>
          </label>
          <label class="filter-toggle" for="r-sr-l-only-toggle">
            <input id="r-sr-l-only-toggle" type="checkbox">
            <span>R/SR/L Only</span>
          </label>
        </div>
      </section>
      <main id="app" class="app-shell"></main>
    </div>

    <script src="cards.js"></script>
    <script src="app.js"></script>
  </body>
</html>
