<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://api.lorcana.ravensburger.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'">
    <title>Lorcana Tier List</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p id="set-eyebrow" class="eyebrow">Loading supported sets…</p>
          <h1 id="page-title">Lorcana Tier Views</h1>
          <p id="page-subhead" class="subhead">
            Choose a set, then drag cards from the untiered pool into A, B, C+, C, C-, D+, D, or F. Cost
            tabs and filter tabs share the same underlying placements, and costs 7 and up are grouped
            together.
          </p>
        </div>
        <div class="hero-actions">
          <label class="set-selector-shell" for="set-selector">
            <span class="set-selector-label">Active set</span>
            <select id="set-selector" class="set-selector"></select>
          </label>
          <div class="action-row">
            <button id="export-json" class="secondary-button" type="button">Export JSON</button>
            <button id="import-json" class="secondary-button" type="button">Import JSON</button>
            <button id="reset-tier" class="secondary-button" type="button">Reset tier</button>
            <button id="reset-all-tiers" class="secondary-button" type="button">Reset all tiers</button>
          </div>
          <p id="status-message" class="status-message" aria-live="polite"></p>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
      </header>

      <section class="tabs-shell">
        <nav id="tabs" class="tabs" aria-label="Card tier views"></nav>
        <div class="tab-filters" aria-label="Tier display and rarity filters">
          <label class="filter-toggle" for="fold-tier-toggle">
            <input id="fold-tier-toggle" type="checkbox">
            <span>Combine C/D tiers</span>
          </label>
          <label class="filter-toggle" for="cu-only-toggle">
            <input id="cu-only-toggle" type="checkbox">
            <span>C/U Only</span>
          </label>
          <label class="filter-toggle" for="r-sr-l-only-toggle">
            <input id="r-sr-l-only-toggle" type="checkbox">
            <span>R/SR/L Only</span>
          </label>
        </div>
      </section>
      <main id="app" class="app-shell"></main>
    </div>

    <script src="data/manifest.js"></script>
    <script src="app.js"></script>
  </body>
</html>
